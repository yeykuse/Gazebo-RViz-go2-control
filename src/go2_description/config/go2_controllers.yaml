controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz，与 Gazebo 物理步长 (0.001s) 一致
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    go2_position_controller:
      type: position_controllers/JointGroupPositionController

go2_position_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
    interface_name: position
